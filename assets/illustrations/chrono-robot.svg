<svg xmlns:xlink="http://www.w3.org/1999/xlink" class="art chrono" viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chrono the robot" focusable="false"><style>@keyframes f{50%{transform:translateY(-6px)}}@keyframes s{to{transform:rotate(360deg)}}@keyframes p{50%{opacity:.5}}.float{animation:f 3s ease-in-out infinite}.spin-slow{animation:s 12s linear infinite;transform-box:fill-box;transform-origin:center}.spin-rev{animation:s 8s linear infinite reverse;transform-box:fill-box;transform-origin:center}.pulse,.blink{animation:p 1.6s ease-in-out infinite}.mpart.off{opacity:.12}</style><g class="float"><line x1="60" y1="8" x2="60" y2="26" stroke="#9fa8da" stroke-width="4"/><circle class="blink" cx="60" cy="8" r="6" fill="#ff5d8f"/><rect x="26" y="26" width="68" height="54" rx="14" fill="#7986cb" stroke="#0b0d2a" stroke-width="4"/><rect x="36" y="38" width="48" height="28" rx="8" fill="#0b1d3a"/><circle class="blink" cx="50" cy="52" r="6" fill="#22e1ff"/><circle class="blink" cx="70" cy="52" r="6" fill="#22e1ff"/><rect x="34" y="86" width="52" height="34" rx="10" fill="#3949ab" stroke="#0b0d2a" stroke-width="4"/><circle cx="60" cy="103" r="8" fill="#ff9f1c"/></g></svg>