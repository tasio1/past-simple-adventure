 r="4" fill="#ff5d8f"/><circle cx="128" cy="180" r="4" fill="#22e1ff"/><rect x="138" y="176" width="14" height="8" rx="2" fill="#ff9f1c"/></g><g class="mpart on" data-part="5"><circle cx="120" cy="64" r="26" fill="#fff" stroke="#0b0d2a" stroke-width="4"/><line x1="120" y1="64" x2="120" y2="46" stroke="#0b0d2a" stroke-width="4" stroke-linecap="round"/><line class="hand" x1="120" y1="64" x2="134" y2="72" stroke="#ff5d8f" stroke-width="4" stroke-linecap="round"/></g><g class="mpart on" data-part="6"><line x1="120" y1="38" x2="120" y2="14" stroke="#9fa8da" stroke-width="4"/><circle class="blink" cx="120" cy="12" r="6" fill="#ff5d8f"/></g><g class="mpart on" data-part="9"><path d="M66 120 Q40 120 40 150 Q40 176 66 176" fill="none" stroke="#3ddc84" stroke-width="5"/><path d="M174 120 Q200 120 200 150 Q200 176 174 176" fill="none" stroke="#3ddc84" stroke-width="5"/></g><g class="mpart on" data-part="11"><polygon class="pulse" points="78,84 60,66 96,66" fill="#22e1ff" stroke="#0b0d2a" stroke-width="2"/></g></g></svg>