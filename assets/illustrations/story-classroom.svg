<svg xmlns:xlink="http://www.w3.org/1999/xlink" class="art scene story-classroom" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="story picture" focusable="false"><style>@keyframes f{50%{transform:translateY(-6px)}}@keyframes s{to{transform:rotate(360deg)}}@keyframes p{50%{opacity:.5}}.float{animation:f 3s ease-in-out infinite}.spin-slow{animation:s 12s linear infinite;transform-box:fill-box;transform-origin:center}.spin-rev{animation:s 8s linear infinite reverse;transform-box:fill-box;transform-origin:center}.pulse,.blink{animation:p 1.6s ease-in-out infinite}.mpart.off{opacity:.12}</style><rect width="400" height="200" fill="#1c2260"/><rect x="0" y="150" width="400" height="50" fill="#5d4037"/><rect x="60" y="30" width="200" height="96" rx="6" fill="#1b5e20" stroke="#8d6e63" stroke-width="6"/><text x="160" y="86" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">LATE AGAIN?</text><circle cx="320" cy="84" r="16" fill="#ffcc80" stroke="#0b0d2a" stroke-width="3"/><rect x="304" y="100" width="32" height="50" rx="8" fill="#ff5d8f" stroke="#0b0d2a" stroke-width="3"/><text x="330" y="60" font-size="24" fill="#fff" class="blink">?!</text></svg>