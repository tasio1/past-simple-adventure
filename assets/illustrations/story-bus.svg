<svg xmlns:xlink="http://www.w3.org/1999/xlink" class="art scene story-bus" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="story picture" focusable="false"><style>@keyframes f{50%{transform:translateY(-6px)}}@keyframes s{to{transform:rotate(360deg)}}@keyframes p{50%{opacity:.5}}.float{animation:f 3s ease-in-out infinite}.spin-slow{animation:s 12s linear infinite;transform-box:fill-box;transform-origin:center}.spin-rev{animation:s 8s linear infinite reverse;transform-box:fill-box;transform-origin:center}.pulse,.blink{animation:p 1.6s ease-in-out infinite}.mpart.off{opacity:.12}</style><rect width="400" height="200" fill="#1c2260"/><rect x="0" y="150" width="400" height="50" fill="#37474f"/><g class="drive-away"><rect x="190" y="84" width="160" height="62" rx="10" fill="#ff9f1c" stroke="#0b0d2a" stroke-width="4"/><g fill="#22e1ff" stroke="#0b0d2a" stroke-width="2"><rect x="204" y="94" width="28" height="24"/><rect x="240" y="94" width="28" height="24"/><rect x="276" y="94" width="28" height="24"/></g><circle cx="222" cy="148" r="12" fill="#263238" stroke="#0b0d2a" stroke-width="3"/><circle cx="318" cy="148" r="12" fill="#263238" stroke="#0b0d2a" stroke-width="3"/></g><g class="run"><circle cx="70" cy="96" r="14" fill="#ffcc80" stroke="#0b0d2a" stroke-width="3"/><rect x="58" y="110" width="24" height="30" rx="6" fill="#22e1ff" stroke="#0b0d2a" stroke-width="3"/><line x1="64" y1="140" x2="56" y2="160" stroke="#0b0d2a" stroke-width="5"/><line x1="78" y1="140" x2="90" y2="160" stroke="#0b0d2a" stroke-width="5"/></g><text x="150" y="70" font-size="26" font-weight="800" fill="#ff5d8f" class="blink">!</text></svg>