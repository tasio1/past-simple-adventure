<svg xmlns:xlink="http://www.w3.org/1999/xlink" class="art glitch" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Glitch, the boss" focusable="false"><style>@keyframes f{50%{transform:translateY(-6px)}}@keyframes s{to{transform:rotate(360deg)}}@keyframes p{50%{opacity:.5}}.float{animation:f 3s ease-in-out infinite}.spin-slow{animation:s 12s linear infinite;transform-box:fill-box;transform-origin:center}.spin-rev{animation:s 8s linear infinite reverse;transform-box:fill-box;transform-origin:center}.pulse,.blink{animation:p 1.6s ease-in-out infinite}.mpart.off{opacity:.12}</style><g class="shake-slow"><path d="M20 120 q-10 -70 50 -90 q60 20 50 90 q-20 12 -50 0 q-30 12 -50 0z" fill="#ff5d8f" stroke="#0b0d2a" stroke-width="4"/><rect x="40" y="62" width="16" height="22" fill="#fff" stroke="#0b0d2a" stroke-width="3"/><rect x="82" y="62" width="16" height="22" fill="#fff" stroke="#0b0d2a" stroke-width="3"/><rect x="45" y="70" width="6" height="10" fill="#0b0d2a"/><rect x="87" y="70" width="6" height="10" fill="#0b0d2a"/><path d="M46 100 l8 -8 l8 8 l8 -8 l8 8 l8 -8 l8 8" fill="none" stroke="#0b0d2a" stroke-width="4"/><path d="M52 30 l-8 -18 l18 10z M88 30 l8 -18 l-18 10z" fill="#ffd54f" stroke="#0b0d2a" stroke-width="3"/></g></svg>